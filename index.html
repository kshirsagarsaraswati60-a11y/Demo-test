<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelle Residency - Interior Tour</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; }
    canvas { display: block; outline: none; }
    
    /* Premium UI */
    .ui-overlay { position: absolute; top: 8%; left: 8%; color: white; z-index: 10; pointer-events: none; }
    .ui-overlay h1 { font-size: 3.5rem; font-weight: 300; letter-spacing: 0.6rem; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,0.9); }
    .ui-overlay p { font-size: 1rem; letter-spacing: 4px; color: #d4c4a8; margin-top: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    
    .scroll-hint { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: white; font-size: 0.8rem; letter-spacing: 2px; opacity: 0.7; animation: bounce 2s infinite; pointer-events: none; z-index: 10; }
    @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.14?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { Suspense, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { Environment, useGLTF, ScrollControls, useScroll, Html, Center, Preload } from '@react-three/drei';
    import * as THREE from 'three';

    const MODEL_URL = 'Aurelle_Residency_Final.glb'; 

    function ResidencyModel() {
      const { scene } = useGLTF(MODEL_URL);
      
      scene.traverse((child) => {
        if (child.isMesh) {
          child.material.envMapIntensity = 1.5;
          if (child.material.name && child.material.name.includes('Glass')) {
            child.material.transparent = true;
            child.material.opacity = 0.15;
            child.material.roughness = 0.0;
          }
        }
      });

      // Center component model ko origin (0,0,0) pe le aayega
      return (
        <Center>
          <primitive object={scene} scale={1} />
        </Center>
      );
    }

    // 🎥 THE INTERIOR WALKTHROUGH CAMERA
    function CameraRig() {
      const scroll = useScroll();
      
      useFrame((state, delta) => {
        const offset = scroll.offset; // 0 se 1 (Scroll bar ke hisaab se)
        
        // Camera ki starting position (Room ke entrance pe, eye level pe)
        const startZ = 8;   // Peeche
        const startY = 1.6; // Aankh ki height (1.6m)
        
        // Camera ki end position (Room ke andar)
        const endZ = -5;    // Aage
        
        // Scroll ke hisaab se camera ko aage badhao
        state.camera.position.z = THREE.MathUtils.lerp(startZ, endZ, offset);
        state.camera.position.y = startY;
        
        // Camera ko hamesha saamne dekhne bolo (y-axis rotate)
        state.camera.lookAt(0, 1.5, -10); 
      });
      return null;
    }

    function App() {
      return (
        <>
          <div className="ui-overlay">
            <h1>AURELLE</h1>
            <p>INTERIOR TOUR</p>
          </div>
          <div className="scroll-hint">SCROLL TO WALK INSIDE ↓</div>

          <Canvas 
            camera={{ position: [0, 1.6, 8], fov: 60 }} // Starting Camera
            dpr={[1, 1.5]} 
            gl={{ antialias: true, toneMapping: 3, toneMappingExposure: 1.2 }} 
          >
            <color attach="background" args={['#050505']} />
            <ambientLight intensity={0.6} />
            <directionalLight position={[5, 10, 5]} intensity={2} color="#ffccaa" />

            <ScrollControls pages={3} damping={0.2}>
              <CameraRig />
              
              <Suspense fallback={<Html center><p style={{color:'white'}}>Loading Interior...</p></Html>}>
                <Environment preset="apartment" background={false} />
                <ResidencyModel />
                <Preload all />
              </Suspense>
            </ScrollControls>
          </Canvas>
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
