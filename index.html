<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelle Residency - 3D Tour</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Inter', sans-serif; }
    canvas { display: block; outline: none; }
    
    /* Premium UI Overlay */
    .ui-overlay { position: absolute; top: 8%; left: 8%; color: white; z-index: 10; pointer-events: none; }
    .ui-overlay h1 { font-size: 3.5rem; font-weight: 300; letter-spacing: 0.6rem; margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,0.9); }
    .ui-overlay p { font-size: 1rem; letter-spacing: 4px; color: #d4c4a8; margin-top: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    
    /* Scroll Hint */
    .scroll-hint { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); color: white; font-size: 0.8rem; letter-spacing: 2px; opacity: 0.6; animation: bounce 2s infinite; pointer-events: none; z-index: 10; font-weight: 300; }
    @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

    /* Loading Screen */
    .loading-screen { position: absolute; inset: 0; background: #050505; display: flex; justify-content: center; align-items: center; z-index: 50; color: #d4c4a8; font-size: 1.2rem; letter-spacing: 3px; }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.14?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.0?external=react,react-dom,three,@react-three/fiber"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { Suspense, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { Environment, useGLTF, ScrollControls, useScroll, Html, Preload } from '@react-three/drei';
    import * as THREE from 'three';

    // 🚨 GITHUB KE LIYE SLASH (/) HATA DIYA HAI
    const MODEL_URL = 'Aurelle_Residency_Final.glb'; 

    // 🎯 TUMHARE AI KE NIKALE HUE 5 ROOMS KE COORDINATES
    const KEYFRAMES = [
      { pos: [-2.38, -7.45, 3.48], target: [-2.38, -0.45, 0.98] }, // 0: Living Room
      { pos: [5.24, -6.10, 3.27],  target: [5.24, 0.90, 0.77] },   // 1: Dining
      { pos: [-0.33, -5.82, 3.16], target: [-0.33, 1.18, 0.66] },  // 2: Kitchen
      { pos: [-2.56, -5.81, 3.07], target: [-2.56, 1.19, 0.57] },  // 3: Bedroom
      { pos: [-6.04, -3.42, 3.09], target: [-6.04, 3.58, 0.59] }   // 4: Bathroom
    ];

    function ResidencyModel() {
      const { scene } = useGLTF(MODEL_URL);
      
      scene.traverse((child) => {
        if (child.isMesh) {
          child.material.envMapIntensity = 1.5;
          if (child.material.name && child.material.name.includes('Glass')) {
            child.material.transparent = true;
            child.material.opacity = 0.15;
            child.material.roughness = 0.0;
          }
        }
      });

      // Agar model ulta (upside down) dikhe, toh yahan rotation={[-Math.PI/2, 0, 0]} add kar dena
      return <primitive object={scene} scale={1} position={[0, 0, 0]} />;
    }

    // 🎥 THE MAGIC CAMERA RIG
    function CameraRig() {
      const scroll = useScroll();
      const currentLookAt = useRef(new THREE.Vector3(...KEYFRAMES[0].target));
      
      useFrame((state, delta) => {
        const offset = scroll.offset; // 0 se 1 tak
        
        const totalSegments = KEYFRAMES.length - 1;
        const scaledOffset = offset * totalSegments;
        const index = Math.min(Math.floor(scaledOffset), totalSegments - 1);
        const progress = scaledOffset - index; 

        const startPos = KEYFRAMES[index].pos;
        const endPos = KEYFRAMES[index + 1].pos;
        const startTarget = KEYFRAMES[index].target;
        const endTarget = KEYFRAMES[index + 1].target;

        // Smooth interpolation
        const targetCamX = THREE.MathUtils.lerp(startPos[0], endPos[0], progress);
        const targetCamY = THREE.MathUtils.lerp(startPos[1], endPos[1], progress);
        const targetCamZ = THREE.MathUtils.lerp(startPos[2], endPos[2], progress);

        const targetLookX = THREE.MathUtils.lerp(startTarget[0], endTarget[0], progress);
        const targetLookY = THREE.MathUtils.lerp(startTarget[1], endTarget[1], progress);
        const targetLookZ = THREE.MathUtils.lerp(startTarget[2], endTarget[2], progress);

        // Camera ko move karwao (lerp for smoothness)
        state.camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), delta * 3);
        currentLookAt.current.lerp(new THREE.Vector3(targetLookX, targetLookY, targetLookZ), delta * 3);
        state.camera.lookAt(currentLookAt.current);
      });
      return null;
    }

    function App() {
      return (
        <>
          <div className="ui-overlay">
            <h1>AURELLE</h1>
            <p>EXCLUSIVE RESIDENCY</p>
          </div>
          <div className="scroll-hint">SCROLL TO EXPLORE ↓</div>

          <Canvas 
            camera={{ position: KEYFRAMES[0].pos, fov: 50 }}
            dpr={[1, 1.5]} 
            gl={{ antialias: true, toneMapping: 3, toneMappingExposure: 1.2 }} 
          >
            <color attach="background" args={['#050505']} />
            <ambientLight intensity={0.4} />
            <directionalLight position={[10, 10, 10]} intensity={1.5} color="#ffccaa" />

            {/* 5 pages ka scroll kyunki 5 rooms hain */}
            <ScrollControls pages={4} damping={0.2}>
              <CameraRig />
              
              <Suspense fallback={<Html center><div className="loading-screen">LOADING EXPERIENCE...</div></Html>}>
                <Environment preset="apartment" background={false} />
                <ResidencyModel />
                <Preload all />
              </Suspense>
            </ScrollControls>
          </Canvas>
        </>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
